<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACEFLEET.IN — Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #02050c;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

/* =====================================================
   SPACE
===================================================== */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(20, 100, 180, .15),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(30, 180, 220, .08),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #01030a 0%,
            #03101c 55%,
            #01040a 100%
        );
}

/* =====================================================
   STARS
===================================================== */

.stars,
.stars2,
.stars3 {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.stars {
    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.55) 1px,
            transparent 1.5px
        );

    background-size:
        150px 150px,
        270px 270px;

    background-position:
        20px 30px,
        100px 80px;

    opacity: .65;
}

.stars2 {
    background-image:
        radial-gradient(
            circle,
            rgba(100,200,255,.9) 1px,
            transparent 2px
        );

    background-size: 330px 330px;
    background-position: 80px 120px;

    opacity: .45;
}

.stars3 {
    background-image:
        radial-gradient(
            circle,
            #fff 1.5px,
            transparent 2px
        );

    background-size: 520px 520px;
    background-position: 160px 90px;

    opacity: .3;
}

/* =====================================================
   BLUE NEBULA
===================================================== */

.nebula {
    position: absolute;

    width: 1000px;
    height: 600px;

    left: 50%;
    top: 5%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0,160,255,.13),
            rgba(0,70,160,.06) 40%,
            transparent 72%
        );

    filter: blur(50px);

    animation:
        nebulaMove 14s ease-in-out infinite alternate;
}

@keyframes nebulaMove {

    from {
        transform:
            translateX(-50%)
            scale(1);
    }

    to {
        transform:
            translateX(-50%)
            scale(1.12);
    }
}

/* =====================================================
   PLANET
===================================================== */

.planet {
    position: absolute;

    width: 110px;
    height: 110px;

    left: 9%;
    top: 15%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 28%,
            #bde7ff,
            #4384b9 35%,
            #143d63 65%,
            #031322
        );

    box-shadow:
        inset -20px -18px 35px rgba(0,0,0,.65),
        0 0 35px rgba(40,170,255,.18);
}

.planet::after {
    content: "";

    position: absolute;

    width: 165px;
    height: 38px;

    left: -27px;
    top: 36px;

    border:
        1px solid
        rgba(100,200,255,.35);

    border-radius: 50%;

    transform: rotate(-15deg);
}

/* =====================================================
   SUN
===================================================== */

.sun {
    position: absolute;

    width: 90px;
    height: 90px;

    right: 12%;
    top: 13%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #baf1ff 22%,
            #42d7ff 55%,
            #0875ba 75%,
            transparent 76%
        );

    box-shadow:
        0 0 30px rgba(50,220,255,.8),
        0 0 80px rgba(20,160,255,.35);
}

/* =====================================================
   SPACECRAFT
===================================================== */

.ship {
    position: absolute;

    width: 150px;
    height: 90px;

    right: 14%;
    top: 34%;

    transform: rotate(-8deg);

    animation:
        shipFloat 8s ease-in-out infinite;
}

@keyframes shipFloat {

    0%,100% {
        transform:
            translate(0,0)
            rotate(-8deg);
    }

    50% {
        transform:
            translate(-35px,15px)
            rotate(-4deg);
    }
}

/* Main spacecraft body */

.ship-body {
    position: absolute;

    width: 72px;
    height: 35px;

    left: 40px;
    top: 25px;

    background:
        linear-gradient(
            135deg,
            #dfeaf3,
            #667b8c
        );

    clip-path:
        polygon(
            0 50%,
            18% 10%,
            75% 10%,
            100% 50%,
            75% 90%,
            18% 90%
        );

    box-shadow:
        0 0 15px rgba(80,210,255,.25);
}

/* Cockpit */

.cockpit {
    position: absolute;

    width: 25px;
    height: 18px;

    left: 82px;
    top: 33px;

    background:
        linear-gradient(
            135deg,
            #baf5ff,
            #187ea5
        );

    clip-path:
        polygon(
            0 50%,
            30% 0,
            100% 20%,
            100% 80%,
            30% 100%
        );

    box-shadow:
        0 0 12px rgba(80,220,255,.8);
}

/* Engine */

.engine {
    position: absolute;

    width: 25px;
    height: 8px;

    left: 18px;
    top: 41px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #44dfff
        );

    filter: blur(2px);

    box-shadow:
        0 0 15px #27dfff;
}

/* Wings */

.wing {
    position: absolute;

    width: 45px;
    height: 12px;

    background: #4c6374;
}

.wing.top {
    left: 42px;
    top: 17px;

    transform: skewX(-35deg);
}

.wing.bottom {
    left: 42px;
    top: 56px;

    transform: skewX(35deg);
}

/* =====================================================
   ORBITAL LINES
===================================================== */

.orbit {
    position: absolute;

    width: 650px;
    height: 210px;

    left: 50%;
    top: 49%;

    transform:
        translate(-50%, -50%)
        rotate(-12deg);

    border:
        1px solid
        rgba(70,190,255,.13);

    border-radius: 50%;
}

.orbit-two {
    position: absolute;

    width: 820px;
    height: 300px;

    left: 50%;
    top: 49%;

    transform:
        translate(-50%, -50%)
        rotate(17deg);

    border:
        1px solid
        rgba(70,150,255,.07);

    border-radius: 50%;
}

/* Orbiting dot */

.orbit-dot {
    position: absolute;

    width: 7px;
    height: 7px;

    right: 7%;
    top: 12%;

    border-radius: 50%;

    background: #56e4ff;

    box-shadow:
        0 0 18px #56e4ff;
}

/* =====================================================
   RADAR
===================================================== */

.radar {
    position: absolute;

    width: 130px;
    height: 130px;

    left: 7%;
    bottom: 18%;

    border:
        1px solid
        rgba(70,190,255,.15);

    border-radius: 50%;

    opacity: .5;
}

.radar::before,
.radar::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border:
        1px solid
        rgba(70,190,255,.1);

    border-radius: 50%;
}

.radar::before {
    width: 80px;
    height: 80px;
}

.radar::after {
    width: 35px;
    height: 35px;
}

.radar-line {
    position: absolute;

    width: 1px;
    height: 50%;

    left: 50%;
    top: 0;

    background:
        linear-gradient(
            180deg,
            #50dcff,
            transparent
        );

    transform-origin: bottom;

    animation:
        radarSpin 4s linear infinite;
}

@keyframes radarSpin {
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   SHOOTING STARS
===================================================== */

.shooting-star {
    position: absolute;

    width: 150px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fff
        );

    transform: rotate(-35deg);

    opacity: 0;

    animation:
        shootingStar 8s linear infinite;
}

.shooting-star.one {
    top: 18%;
    left: -10%;
}

.shooting-star.two {
    top: 43%;
    left: 42%;

    animation-delay: 4s;
}

@keyframes shootingStar {

    0% {
        transform:
            translate(0,0)
            rotate(-35deg);

        opacity: 0;
    }

    5% {
        opacity: 1;
    }

    18% {
        transform:
            translate(600px,350px)
            rotate(-35deg);

        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* =====================================================
   MAIN CONTENT
===================================================== */

.content {
    position: relative;
    z-index: 30;

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding:
        30px
        20px
        150px;
}

/* Brand */

.brand {
    font-size: clamp(27px, 4vw, 46px);

    font-weight: 700;

    letter-spacing: 9px;

    margin-bottom: 30px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #5fe1ff,
            #ffffff
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        brandShine 5s linear infinite;
}

@keyframes brandShine {

    to {
        background-position:
            200% center;
    }
}

/* Mission status */

.status {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding:
        7px
        14px;

    border:
        1px solid
        rgba(70,200,255,.2);

    border-radius: 30px;

    color: #7edfff;

    background:
        rgba(20,100,150,.08);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 28px;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #4ce5ff;

    box-shadow:
        0 0 10px #4ce5ff;

    animation:
        statusPulse 2s infinite;
}

@keyframes statusPulse {

    50% {
        opacity: .35;
    }
}

/* Heading */

h1 {
    font-size: clamp(55px, 10vw, 120px);

    line-height: .9;

    letter-spacing: -5px;

    font-weight: 700;

    margin-bottom: 30px;
}

.white {
    color: #fff;
}

.gradient {
    background:
        linear-gradient(
            90deg,
            #62e6ff,
            #4ba8ff,
            #7e72ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

/* Description */

.description {
    max-width: 680px;

    color: #aab9ca;

    font-size: 16px;

    line-height: 1.8;

    letter-spacing: .8px;

    margin-bottom: 23px;
}

/* Collaboration */

.interest {
    color: #718196;

    font-size: 13px;

    margin-bottom: 17px;
}

.interest strong {
    color: #c8d6e6;

    font-weight: 500;
}

/* CTA */

.contact {
    display: inline-flex;

    align-items: center;

    gap: 11px;

    padding:
        13px
        28px;

    border:
        1px solid
        rgba(80,200,255,.4);

    border-radius: 50px;

    background:
        rgba(10,40,60,.35);

    color: #d9f4ff;

    text-decoration: none;

    font-size: 14px;

    backdrop-filter: blur(10px);

    transition: .3s ease;
}

.contact:hover {
    transform: translateY(-3px);

    border-color:
        rgba(80,220,255,.9);

    box-shadow:
        0 0 30px
        rgba(40,190,255,.25);
}

.contact-icon {
    color: #55e5ff;

    font-size: 17px;
}

/* =====================================================
   EARTH HORIZON
===================================================== */

.earth {
    position: absolute;

    z-index: 10;

    width: 155%;
    height: 430px;

    left: -27.5%;
    bottom: -350px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(20,130,200,.55),
            rgba(5,45,80,.55) 30%,
            #01040a 70%
        );

    border-top:
        2px solid
        rgba(70,210,255,.85);

    box-shadow:
        0 -8px 30px
        rgba(30,190,255,.7),

        0 -20px 80px
        rgba(20,120,255,.25);
}

.earth::before {
    content: "";

    position: absolute;

    width: 400px;
    height: 75px;

    left: 50%;
    top: -28px;

    transform: translateX(-50%);

    background:
        rgba(70,210,255,.7);

    filter: blur(35px);

    border-radius: 50%;
}

.earth::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: -5px;

    transform: translateX(-50%);

    background: #fff;

    border-radius: 50%;

    box-shadow:
        0 0 15px 5px #fff,
        0 0 40px 15px
        rgba(60,200,255,.8);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .planet {
        width: 55px;
        height: 55px;

        left: 5%;
        top: 18%;
    }

    .planet::after {
        width: 85px;
        height: 23px;

        left: -15px;
        top: 16px;
    }

    .sun {
        width: 60px;
        height: 60px;

        right: 7%;
        top: 9%;
    }

    .ship {
        right: 4%;
        top: 29%;

        transform: scale(.65);
    }

    .orbit {
        width: 330px;
        height: 115px;
    }

    .orbit-two {
        width: 420px;
        height: 160px;
    }

    .radar {
        width: 80px;
        height: 80px;

        left: 5%;
        bottom: 20%;
    }

    .radar::before {
        width: 50px;
        height: 50px;
    }

    .radar::after {
        width: 22px;
        height: 22px;
    }

    .brand {
        font-size: 26px;
        letter-spacing: 6px;
    }

    .status {
        font-size: 8px;
        letter-spacing: 2px;
    }

    h1 {
        font-size: 60px;
        letter-spacing: -3px;
    }

    .description {
        font-size: 14px;
        line-height: 1.7;

        max-width: 340px;
    }

    .interest {
        font-size: 12px;
    }

    .contact {
        padding:
            12px
            23px;
    }

    .earth {
        width: 190%;
        left: -45%;
        bottom: -285px;
    }
}
</style>
</head>
